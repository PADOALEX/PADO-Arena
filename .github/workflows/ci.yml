name: .NET CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build-test:
    name: Build and test (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore PADO.Arena.sln
      - name: Build
        run: dotnet build PADO.Arena.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test PADO.Arena.sln --configuration Release --no-build --verbosity normal